function switchTab(platform) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab.' + platform).classList.add('active');

}

function getFabricType(c) {
    if (!c) return 'patterned';
    const code = c.trim().toUpperCase();

    // 1. ตรวจสอบผ้าพรีเมี่ยม (ขึ้นต้นด้วย Z หรือ M เช่น Z-05, M-04)
    if (/^[ZM]-?\d*/i.test(code)) return 'premium';
    for (const s of premiumCodes) if (code.includes(s.toUpperCase())) return 'premium';

    // 2. ตรวจสอบผ้าโปร่ง (733, 734)
    for (const s of sheerCodes) if (code.includes(s)) return 'sheer';

    // 3. ตรวจสอบผ้าพื้น (A4-A18, 828)
    if (/A\d+/i.test(code)) return 'solid';
    if (code.includes('828')) return 'solid';
    for (const s of solidCodes) if (code.toUpperCase().includes(s.toUpperCase())) return 'solid';

    // 4. ตรวจสอบผ้าลาย (2021-x, เลข 3 หลัก)
    if (/2021-\d+/i.test(code)) return 'patterned';
    const numMatch = code.match(/\d{3}/);
    if (numMatch && !code.includes('828')) return 'patterned';

    // 5. Default = ผ้าลาย
    return 'patterned';
}

function findBaseCost(t, w, h) {
    let bc = 0, bw = 0, bh = 0;
    const effectiveW = Math.max(w, 1.30);
    for (const r of t) {
        if (effectiveW >= r.minW && r.minW <= effectiveW) {
            const effectiveH = Math.min(h, 2.60);
            if (effectiveH >= r.minH && effectiveH <= r.maxH) {
                bc = r.cost; bw = r.minW; bh = r.maxH;
            }
        }
    }
    if (bc === 0) {
        let md = Infinity;
        for (const r of t) {
            const d = Math.abs(effectiveW - r.minW);
            if (d < md) { md = d; bc = r.cost; bw = r.minW; bh = r.maxH; }
        }
    }
    return { baseCost: bc, baseWidth: bw, baseHeight: bh };
}

function calculateCost(col, sz) {
    if (!sz) return 0;
    const p = sz.split('*');
    if (p.length !== 2) return 0;
    const w = parseFloat(p[0]), h = parseFloat(p[1]);
    if (isNaN(w) || isNaN(h)) return 0;
    const ft = getFabricType(col);
    if (w >= 2.70 && h > 2.60) {
        const priceOversized = (ft === 'solid') ? priceOversizedSolid : priceOversizedPatterned;
        for (const r of priceOversized) {
            if (w >= r.minW && w <= r.maxW && h >= r.minH && h <= r.maxH) return r.cost;
        }
        let cc = 0, md = Infinity;
        for (const r of priceOversized) {
            const d = Math.abs(w - (r.minW + r.maxW) / 2);
            if (d < md && h >= r.minH && h <= r.maxH) { md = d; cc = r.cost; }
        }
        if (cc > 0) return cc;
    }
    let pt;
    switch (ft) {
        case 'sheer': pt = priceSheer; break;
        case 'solid': pt = priceSolid; break;
        default: pt = pricePatterned;
    }
    const { baseCost: bc, baseWidth: bw, baseHeight: bh } = findBaseCost(pt, w, h);
    if (bc === 0) return 0;
    let extraCost = 0;
    extraCost += Math.max(0, Math.round((w - bw) * 100));
    if (h > bh) extraCost += Math.round((h - bh) * 100);
    return bc + extraCost;
}

// Parse Shopee Order - อ้างอิงจาก SKU
function parseShopeeOrder(text) {
    const order = { orderId: '', orderDate: '', customerName: '', address: '', username: '', products: [], totalPayment: 0, totalCost: 0, platform: 'shopee' };

    // ดึง Order ID
    const orderIdMatch = text.match(/หมายเลขคำสั่งซื้อ\s*[\n\r]*\s*(\w+)/);
    if (orderIdMatch) order.orderId = orderIdMatch[1];

    // ดึงวันที่จาก Order ID (6 ตัวแรก = YYMMDD)
    if (order.orderId && order.orderId.length >= 6) {
        const d = order.orderId.substring(0, 6);
        order.orderDate = parseInt(d.substring(0, 2)) + '/' + parseInt(d.substring(2, 4)) + '/' + (2000 + parseInt(d.substring(4, 6)) + 543);
    }

    // ดึงชื่อ-ที่อยู่
    const addressMatch = text.match(/ที่อยู่ในการจัดส่ง\s*[\n\r]+([^\n\r]+)[\n\r]+([^\n\r]+)/);
    if (addressMatch) {
        order.customerName = addressMatch[1].trim();
        order.address = addressMatch[2].trim();
    }

    const lines = text.split(/[\n\r]+/);

    // ดึง Username (ก่อน "รายละเอียดการชำระเงิน")
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes('รายละเอียดการชำระเงิน')) {
            for (let j = i - 1; j >= Math.max(0, i - 5); j--) {
                const line = lines[j].trim();
                if (/^[a-zA-Z0-9_][a-zA-Z0-9_.]*$/.test(line) && line.length >= 2 && line.length <= 100 && !line.match(/^\d+$/)) {
                    order.username = '@' + line;
                    break;
                }
            }
            break;
        }
    }

    // ดึงสินค้าจาก "เลข SKU:" (อ้างอิงหลัก)
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        // หา "เลข SKU:" ซึ่งมี format: เลข SKU: สี,กว้าง X สูง Y
        if (line.startsWith('เลข SKU:')) {
            // ดึงข้อมูลจาก SKU
            let skuContent = line.replace('เลข SKU:', '').trim();

            // ตรวจสอบ ตีนตุ๊กแก / ม่านตะขอ
            let note = '';
            if (skuContent.includes('ตีนตุ๊กแก')) {
                note = 'ตีนตุ๊กแก';
                skuContent = skuContent.replace('ตีนตุ๊กแก', '').trim();
            } else if (skuContent.includes('ม่านตะขอ')) {
                note = 'ม่านตะขอ';
                skuContent = skuContent.replace('ม่านตะขอ', '').trim();
            }

            // ดึงขนาด กว้าง X สูง Y
            let productSize = '';
            const sizeMatch = skuContent.match(/กว้าง\s*([\d.]+)\s*สูง\s*([\d.]+)/);
            if (sizeMatch) {
                let w = parseFloat(sizeMatch[1]);
                let h = parseFloat(sizeMatch[2]);
                if (w >= 100) w = w / 100;
                if (h >= 100) h = h / 100;
                productSize = w.toFixed(2) + '*' + h.toFixed(2);
            }

            // ดึงจำนวน
            let quantity = 1;
            let nextIdx = i + 1;
            if (nextIdx < lines.length) {
                const priceLine = lines[nextIdx].trim();
                if (/^[\d,]+$/.test(priceLine)) {
                    if (nextIdx + 1 < lines.length) {
                        const qtyLine = lines[nextIdx + 1].trim();
                        if (/^\d+$/.test(qtyLine)) {
                            quantity = parseInt(qtyLine);
                        }
                    }
                }
            }

            // แยกสี (คั่นด้วย ,กว้าง)
            const skuParts = skuContent.split(/,\s*กว้าง/);
            let colorPart = skuParts.length >= 1 ? skuParts[0].trim() : '';

            // ตรวจสอบ 1 แถม 1 (สี+ม่านโปร่ง)
            if (colorPart.includes('+ม่านโปร่ง')) {
                // แยกเป็น 2 รายการ
                const mainColor = colorPart.replace('+ม่านโปร่ง', '').trim();

                // แปลงสีเป็นรหัส A
                let solidCode = mainColor;
                if (mainColor === 'สีเทาเข้ม' || mainColor === 'เทาเข้ม') solidCode = 'เทาเข้ม A6';
                else if (mainColor === 'สีเทาอ่อน' || mainColor === 'เทาอ่อน') solidCode = 'เทาอ่อน A4';
                else if (mainColor === 'สีครีม' || mainColor === 'ครีม') solidCode = 'ครีม A7';
                else if (mainColor === 'น้ำตาล') solidCode = 'น้ำตาล A8';

                // สินค้า 1: ผ้าทึบ
                const product1 = {
                    color: solidCode,
                    size: productSize,
                    quantity: quantity,
                    cost: 0,
                    note: note
                };
                product1.cost = calculateCost(product1.color, product1.size);
                order.products.push(product1);

                // สินค้า 2: ผ้าโปร่ง 734
                const product2 = {
                    color: '734',
                    size: productSize,
                    quantity: quantity,
                    cost: 0,
                    note: note
                };
                product2.cost = calculateCost(product2.color, product2.size);
                order.products.push(product2);
            } else {
                // สินค้าปกติ
                const product = {
                    color: colorPart,
                    size: productSize,
                    quantity: quantity,
                    cost: 0,
                    note: note
                };
                product.cost = calculateCost(product.color, product.size);
                order.products.push(product);
            }
        }
    }

    // ดึงยอดชำระ
    let pp = 0, sf = 0;
    const bs = text.match(/การชำระเงินของผู้ซื้อ[\s\S]*?รวมค่าสินค้า\s*[฿B]?([\d,]+)/);
    if (bs) pp = parseInt(bs[1].replace(/,/g, ''));
    const bsh = text.match(/การชำระเงินของผู้ซื้อ[\s\S]*?ค่าจัดส่ง\s*[฿B]?([\d,]+)/);
    if (bsh) sf = parseInt(bsh[1].replace(/,/g, ''));
    order.totalPayment = pp + sf;

    // คำนวณต้นทุนรวม
    order.totalCost = order.products.reduce((s, p) => s + (p.cost * p.quantity), 0);

    // ถ้าไม่พบสินค้า ให้เพิ่ม default
    if (order.products.length === 0) order.products.push({ color: '', size: '', quantity: 1, cost: 0 });

    return order;
}

// Parse Lazada Order - ใช้ รหัสสินค้า:
function parseLazadaOrder(text) {
    const order = { orderId: '', orderDate: '', customerName: '', address: '', username: '', products: [], totalPayment: 0, totalCost: 0, platform: 'lazada' };

    // ดึง Order ID
    const orderIdMatch = text.match(/หมายเลขคำสั่งซื้อ:\s*(\d+)/);
    if (orderIdMatch) order.orderId = orderIdMatch[1];

    // ดึงวันที่
    const dateMatch = text.match(/วันที่:\s*(\d{2})\s*(\w+)\s*(\d{4})/);
    if (dateMatch) {
        const months = { 'Jan': 1, 'Feb': 2, 'Mar': 3, 'Apr': 4, 'May': 5, 'Jun': 6, 'Jul': 7, 'Aug': 8, 'Sep': 9, 'Oct': 10, 'Nov': 11, 'Dec': 12 };
        const day = parseInt(dateMatch[1]);
        const month = months[dateMatch[2]] || 1;
        const year = parseInt(dateMatch[3]) + 543;
        order.orderDate = day + '/' + month + '/' + year;
    }

    // ดึงชื่อลูกค้า (หาชื่อเต็มจาก "ชื่อผู้รับ" ที่มีข้อมูลจริง)
    const lines = text.split(/[\n\r]+/);
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes('ชื่อผู้รับ') && i + 1 < lines.length) {
            const nextLine = lines[i + 1].trim();
            // ชื่อเต็มจะมีมากกว่า 5 ตัวอักษรและไม่ใช่ข้อมูลอื่น
            if (nextLine.length > 5 && !nextLine.includes('เบอร์') && !nextLine.includes('ที่อยู่')) {
                order.customerName = nextLine;
                break;
            }
        }
    }

    // ดึงที่อยู่ (ใช้ที่อยู่เรียกเก็บเงินที่เป็นภาษาไทยเต็ม)
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        // หาบรรทัดที่มี ตำบล/อำเภอ/จังหวัด หรือ Thailand
        if ((line.includes('ตำบล') || line.includes('อำเภอ') || line.includes('จังหวัด')) && line.length > 20) {
            order.address = line;
            break;
        }
        if (line.includes(', Thailand') && line.length > 30) {
            order.address = line;
            break;
        }
    }

    // ดึงเบอร์โทร
    const phoneMatch = text.match(/เบอร์ผู้รับ\s*[\n\r]+([^\n\r]+)/);
    if (phoneMatch) order.username = phoneMatch[1].trim();

    // ฟังก์ชันแปลงสี Lazada เป็นรหัส
    function convertLazadaColorCode(color) {
        const colorMap = {
            'เทาเข้ม': 'เทาเข้ม A6',
            'เทาอ่อน': 'เทาอ่อน A4',
            'สีเทาเข้ม': 'เทาเข้ม A6',
            'สีเทาอ่อน': 'เทาอ่อน A4',
            'ครีม': 'ครีม A7',
            'สีครีม': 'ครีม A7',
            'น้ำตาล': 'น้ำตาล A8',
            'ลายจุด': '733',
            'ลายเรียบ': '734'
        };
        // ถ้ามีรหัส A อยู่แล้ว ไม่ต้องแปลง
        if (/A\d+/i.test(color)) return color;
        return colorMap[color] || color;
    }

    // หาตำแหน่ง "ข้อมูลการชำระเงินของฉัน" เพื่อหยุดนับ
    let stopIndex = lines.length;
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes('ข้อมูลการชำระเงินของฉัน')) {
            stopIndex = i;
            break;
        }
    }

    // ดึงสินค้าจาก "รหัสสินค้า:" (เฉพาะก่อน "ข้อมูลการชำระเงินของฉัน")
    const tempProducts = [];
    for (let i = 0; i < stopIndex; i++) {
        const line = lines[i].trim();

        // Format: รหัสสินค้า: A4,กว้าง 1.80 สูง 2.80
        // หรือ: รหัสสินค้า: เทาอ่อน,150,160
        if (line.startsWith('รหัสสินค้า:')) {
            const skuContent = line.replace('รหัสสินค้า:', '').trim();

            let color = '';
            let size = '';

            // Format 1: สี,กว้าง X สูง Y
            const format1 = skuContent.match(/^([^,]+),\s*กว้าง\s*([\d.]+)\s*สูง\s*([\d.]+)/);
            if (format1) {
                color = convertLazadaColorCode(format1[1].trim());
                let w = parseFloat(format1[2]);
                let h = parseFloat(format1[3]);
                if (w >= 100) w = w / 100;
                if (h >= 100) h = h / 100;
                size = w.toFixed(2) + '*' + h.toFixed(2);
            } else {
                // Format 2: สี,กว้าง_ซม,สูง_ซม (เช่น เทาอ่อน,150,160)
                const format2 = skuContent.match(/^([^,]+),\s*(\d+),\s*(\d+)/);
                if (format2) {
                    color = convertLazadaColorCode(format2[1].trim());
                    const w = parseInt(format2[2]) / 100;
                    const h = parseInt(format2[3]) / 100;
                    size = w.toFixed(2) + '*' + h.toFixed(2);
                }
            }

            if (color && size) {
                tempProducts.push({ color, size });
            }
        }
    }

    // รวมสินค้าที่สี+ขนาดเดียวกัน (นับจำนวนจากการซ้ำ)
    const productMap = {};
    tempProducts.forEach(p => {
        const key = p.color + '|' + p.size;
        if (productMap[key]) {
            productMap[key].quantity++;
        } else {
            productMap[key] = { color: p.color, size: p.size, quantity: 1, cost: 0, note: '' };
        }
    });
    
    // คำนวณต้นทุนและเพิ่มลง order.products
    for (const key in productMap) {
        const p = productMap[key];
        p.cost = calculateCost(p.color, p.size);
        order.products.push(p);
    }
    
    // ดึงยอดชำระ = ยอดทั้งหมด + ค่าจัดส่ง
    let totalAmount = 0, shippingFee = 0;
    const totalMatch = text.match(/ยอดทั้งหมด:\s*฿([\d,]+)/);
    if (totalMatch) totalAmount = parseInt(totalMatch[1].replace(/,/g, ''));
    const shippingMatch = text.match(/ค่าจัดส่ง\s*฿([\d,]+)/);
    if (shippingMatch) shippingFee = parseInt(shippingMatch[1].replace(/,/g, ''));
    order.totalPayment = totalAmount + shippingFee;
    
    order.totalCost = order.products.reduce((s, p) => s + (p.cost * p.quantity), 0);
    if (order.products.length === 0) order.products.push({ color: '', size: '', quantity: 1, cost: 0 });
    return order;
}

function parseAndPreview(platform) {
    const input = document.getElementById(platform + 'Input').value.trim();
    const preview = document.getElementById(platform + 'Preview');
    const content = document.getElementById(platform + 'PreviewContent');
    const error = document.getElementById(platform + 'Error');
    
    if (!input) {
        error.textContent = '❌ กรุณาวางข้อมูล Order ก่อน';
        error.classList.add('show');
        preview.classList.remove('show');
        return;
    }
    error.classList.remove('show');
    
    const o = platform === 'shopee' ? parseShopeeOrder(input) : parseLazadaOrder(input);
    currentParsedOrder[platform] = o;
    
    const tq = o.products.reduce((s, p) => s + p.quantity, 0);
    let h = '<p><strong>เลข Order:</strong> ' + (o.orderId || '❌ ไม่พบ') + '</p>';
    h += '<p><strong>วันที่:</strong> ' + (o.orderDate || '❌ ไม่พบ') + '</p>';
    h += '<p><strong>ชื่อลูกค้า:</strong> ' + (o.customerName || '❌ ไม่พบ') + '</p>';
    h += '<p><strong>ที่อยู่:</strong> ' + (o.address || '❌ ไม่พบ') + '</p>';
    h += '<p><strong>Username/เบอร์:</strong> ' + (o.username || '❌ ไม่พบ') + '</p>';
    h += '<p><strong>จำนวนสินค้า:</strong> ' + o.products.length + ' รายการ (รวม ' + tq + ' ผืน)</p><hr>';
    
    o.products.forEach((p, i) => {
        const ft = getFabricType(p.color);
        let fl = '🟠 ผ้าลาย';
        if (ft === 'premium') fl = '🟣 ผ้าพรีเมี่ยม';
        else if (ft === 'sheer') fl = '🔵 ผ้าโปร่ง';
        else if (ft === 'solid') fl = '🟢 ผ้าพื้น';
        h += '<div style="background:#f5f5f5;padding:8px;margin:5px 0;border-radius:4px;">';
        h += '<strong>#' + (i + 1) + '</strong> ' + fl;
        if (p.note) h += ' <span style="background:#ff9800;color:white;padding:1px 6px;border-radius:4px;font-size:12px;">' + p.note + '</span>';
        h += '<br>';
        h += 'สี: ' + (p.color || '-') + ', ขนาด: ' + (p.size || '-') + ', จำนวน: ' + p.quantity + '<br>';
        h += '<span style="color:#e65100;font-weight:bold;">💰 ต้นทุน: ' + p.cost.toFixed(2) + ' บาท/ผืน</span></div>';
    });
    
    h += '<hr><p><strong>ยอดชำระ:</strong> ' + o.totalPayment.toLocaleString() + ' บาท</p>';
    h += '<p><strong>ต้นทุนรวม:</strong> <span style="color:#e65100;">' + o.totalCost.toFixed(2) + ' บาท</span></p>';
    
    content.innerHTML = h;
    preview.classList.add('show');
}

function addOrder(platform) {
    if (!currentParsedOrder[platform]) {
        parseAndPreview(platform);
        if (!currentParsedOrder[platform]) return;
    }
    if (orders.find(o => o.orderId === currentParsedOrder[platform].orderId)) {
        alert('Order นี้เพิ่มไปแล้ว!');
        return;
    }
    orders.push(JSON.parse(JSON.stringify(currentParsedOrder[platform])));
    updateOrderList();
    clearInput(platform);
    document.getElementById('generateBtn').disabled = false;
}

function removeOrder(i) {
    orders.splice(i, 1);
    updateOrderList();
    if (orders.length === 0) document.getElementById('generateBtn').disabled = true;
}

function updateOrderList() {
    const le = document.getElementById('orderList');
    const ce = document.getElementById('orderCount');
    const se = document.getElementById('summary');
    const cse = document.getElementById('costSummary');
    ce.textContent = orders.length;
    
    if (orders.length === 0) {
        le.innerHTML = '<div class="empty-state">ยังไม่มี Order</div>';
        se.style.display = 'none';
        cse.style.display = 'none';
        return;
    }
    
    let h = '', ti = 0, tp = 0, tc = 0;
    orders.forEach((o, i) => {
        const oq = o.products.reduce((s, p) => s + p.quantity, 0);
        ti += oq; tp += o.totalPayment; tc += o.totalCost;
        const platformClass = o.platform || 'shopee';
        h += '<div class="order-item ' + platformClass + '">';
        h += '<div class="order-header"><span class="order-id ' + platformClass + '">#' + (i + 1) + ' - ' + o.orderId;
        h += '<span class="platform-badge ' + platformClass + '">' + (platformClass === 'lazada' ? 'Lazada' : 'Shopee') + '</span></span>';
        h += '<button class="btn btn-danger" style="padding:6px 12px;font-size:12px" onclick="removeOrder(' + i + ')">✕</button></div>';
        h += '<div class="order-details"><span>📅 ' + o.orderDate + '</span><span>👤 ' + (o.username || o.customerName) + '</span>';
        h += '<span>🔢 ' + oq + ' ผืน</span><span>💰 ' + o.totalPayment.toLocaleString() + ' บาท</span></div>';
        o.products.forEach((p, pi) => {
            h += '<div class="product-item">สินค้า ' + (pi + 1) + ': ' + (p.color || '-') + ' | ' + (p.size || '-');
            h += ' | ' + p.quantity + ' ผืน <span class="cost">(ต้นทุน ' + (p.cost * p.quantity).toFixed(2) + ' บาท)</span></div>';
        });
        h += '</div>';
    });
    
    le.innerHTML = h;
    document.getElementById('totalOrders').textContent = orders.length;
    document.getElementById('totalItems').textContent = ti;
    document.getElementById('totalPrice').textContent = tp.toLocaleString();
    se.style.display = 'block';
    document.getElementById('totalCost').textContent = tc.toFixed(2);
    document.getElementById('totalProfit').textContent = (tp - tc).toFixed(2);
    cse.style.display = 'block';
}

function clearInput(platform) {
    document.getElementById(platform + 'Input').value = '';
    document.getElementById(platform + 'Preview').classList.remove('show');
    document.getElementById(platform + 'Error').classList.remove('show');
    currentParsedOrder[platform] = null;
}

function clearAllOrders() {
    if (orders.length > 0 && !confirm('ต้องการลบ Order ทั้งหมดหรือไม่?')) return;
    orders = [];
    updateOrderList();
    document.getElementById('generateBtn').disabled = true;
}

function generateWord() {
    if (orders.length === 0) { alert('กรุณาเพิ่ม Order ก่อน'); return; }
    
    const dt = document.getElementById('docTitle').value || 'SALE';
    const dd = document.getElementById('deliveryDate').value;
    const odi = document.getElementById('orderDate').value;
    const pf = document.getElementById('platformLabel').value;
    
    let fdd = '';
    if (dd) {
        const d = new Date(dd);
        fdd = d.getDate() + '/' + (d.getMonth() + 1) + '/' + (d.getFullYear() + 543).toString().slice(-2);
    }
    let ood = '';
    if (odi) {
        const od = new Date(odi);
        ood = od.getDate() + '/' + (od.getMonth() + 1) + '/' + (od.getFullYear() + 543);
    }
    
    let tq = 0, tp = 0, tc = 0, tr = '';
    orders.forEach(o => {
        tp += o.totalPayment;
        tc += o.totalCost;
        let qs = [], cs = [], ss = [], cts = [], notes = [];

        // 1. เพิ่มผ้าม่านก่อน
        o.products.forEach(p => {
            tq += p.quantity;
            qs.push(p.quantity);
            cs.push(p.color || '');
            ss.push(p.size || '');
            cts.push((p.cost * p.quantity).toFixed(2));
            notes.push(p.note || '');
        });

        // 2. เพิ่มสายรวบเรียบตามสีและจำนวนผ้าม่าน
        o.products.forEach(p => {
            qs.push(p.quantity);
            // ดึงเฉพาะรหัสสี
            let colorCode = p.color || '';
            // ถ้าสีขึ้นต้นด้วยตัวเลข (เช่น 2021-5, 734, 861) ใช้ทั้งหมด
            // ถ้าสีมีชื่อไทย+รหัส (เช่น เทาเข้ม A6) ดึงเฉพาะรหัส
            if (/^\d/.test(colorCode)) {
                // สีขึ้นต้นด้วยตัวเลข เช่น 2021-5, 734 → ใช้ทั้งหมด
                colorCode = colorCode.trim();
            } else {
                // สีมีชื่อไทย เช่น "เทาเข้ม A6" → ดึงเฉพาะ A6
                const match = colorCode.match(/([A-Z]\d+(-\d+)?|\d{3,4}(-\d+)?)/i);
                if (match) colorCode = match[1];
            }
            cs.push(colorCode);
            ss.push('สายรวบเรียบ');
            cts.push('');
            notes.push('');
        });
        const dod = ood || o.orderDate;
        tr += '<tr>';
        tr += '<td style="text-align:center;border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + dod + '</td>';
        
        // Shopee: เลขคำสั่งซื้อ ชื่อ-ที่อยู่ @username
        // Lazada: ชื่อ เบอร์ ที่อยู่ เลขคำสั่งซื้อ
        if (o.platform === 'lazada') {
            tr += '<td style="border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + (o.customerName || '') + ' ' + (o.username || '') + '<br>' + (o.address || '') + '<br>' + o.orderId + '</td>';
        } else {
            tr += '<td style="border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + o.orderId + ' ' + (o.customerName || '') + '<br>' + (o.address || '') + '<br>' + (o.username || '') + '</td>';
        }
        
        tr += '<td style="text-align:center;border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + qs.join('<br>') + '</td>';
        tr += '<td style="text-align:center;border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + cs.join('<br>') + '</td>';
        tr += '<td style="text-align:center;border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + ss.join('<br>') + '</td>';
        // ช่องเซ็นรับ - แสดง note (ตีนตุ๊กแก/ม่านตะขอ)
        tr += '<td style="text-align:center;border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + notes.join('<br>') + '</td>';
        tr += '<td style="text-align:center;border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + cts.join('<br>') + '</td>';
        tr += '<td style="text-align:center;border:1px solid black;padding:5px;font-size:16pt;vertical-align:top">' + o.totalPayment + '</td>';
        tr += '</tr>';
    });
    
    const pfLabel = pf ? ' <span style="background-color:cyan;padding:2px 8px;">' + pf + '</span>' : '';
    
    const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><style>@page{size:landscape;margin:1cm;}@page Section1{size:841.9pt 595.3pt;mso-page-orientation:landscape;margin:1cm;}div.Section1{page:Section1;}body{font-family:"TH SarabunPSK","TH Sarabun New",sans-serif;font-size:16pt;}table{border-collapse:collapse;width:100%;}th{border:1px solid black;padding:5px;text-align:center;font-weight:bold;font-size:16pt;}td{font-family:"TH SarabunPSK","TH Sarabun New",sans-serif;}.title{text-align:left;font-size:18pt;font-weight:bold;margin-bottom:10px;}.highlight{background-color:yellow;}</style></head><body><div class="Section1"><div class="title">' + dt + ' <span class="highlight">ของจัดส่งวันที่ ' + fdd + '</span>' + pfLabel + '</div><table><tr><th style="width:10%">วันที่ออเดอร์</th><th style="width:32%">ชื่อ-ที่อยู่</th><th style="width:6%">จำนวน</th><th style="width:12%">สี</th><th style="width:10%">ขนาด</th><th style="width:6%">เซ็นรับ</th><th style="width:10%">ราคา</th><th style="width:10%">ชำระ</th></tr>' + tr + '<tr><td colspan="2" style="text-align:center;border:1px solid black;padding:5px;font-weight:bold;font-size:16pt">รวม</td><td colspan="4" style="text-align:center;border:1px solid black;padding:5px;font-weight:bold;font-size:16pt">' + tq + ' ผืน</td><td style="text-align:center;border:1px solid black;padding:5px;font-weight:bold;font-size:16pt">' + tc.toFixed(2) + '</td><td style="text-align:center;border:1px solid black;padding:5px;font-weight:bold;font-size:16pt">' + tp + '</td></tr></table></div></body></html>';
    
    const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = dt + '_' + fdd.replace(/\//g, '-') + '.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
